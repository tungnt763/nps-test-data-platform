apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-coordinator
  namespace: {{ .Release.Namespace }}
  labels:
    app: dremio
    role: coordinator
spec:
  replicas: {{ .Values.coordinator.count }}
  serviceName: {{ .Release.Name }}-coordinator
  selector:
    matchLabels:
      app: dremio
      role: coordinator
  template:
    metadata:
      labels:
        app: dremio
        role: coordinator
    spec:
      initContainers:
        - name: setup-config
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              cat > /opt/dremio/conf/dremio.conf <<'DREMIOCONF'
              paths: {
                local: "/opt/dremio/data"
                dist: "pdfs:///opt/dremio/data/pdfs"
              }
              services: {
                coordinator.enabled: true,
                coordinator.master.enabled: true,
                executor.enabled: false,
                coordinator.web.port: 9047,
                coordinator.client-endpoint.port: 31010,
                flight.port: 32010
              }
              DREMIOCONF
              cat > /opt/dremio/conf/core-site.xml <<'CORESITE'
              <?xml version="1.0"?>
              <configuration>
                <property>
                  <name>fs.s3a.endpoint</name>
                  <value>{{ .Values.distStorage.aws.endpoint }}</value>
                </property>
                <property>
                  <name>fs.s3a.access.key</name>
                  <value>{{ .Values.distStorage.aws.credentials.accessKey }}</value>
                </property>
                <property>
                  <name>fs.s3a.secret.key</name>
                  <value>{{ .Values.distStorage.aws.credentials.secret }}</value>
                </property>
                <property>
                  <name>fs.s3a.path.style.access</name>
                  <value>true</value>
                </property>
                <property>
                  <name>fs.s3a.connection.ssl.enabled</name>
                  <value>false</value>
                </property>
              </configuration>
              CORESITE
          volumeMounts:
            - name: dremio-config
              mountPath: /opt/dremio/conf
      containers:
        - name: dremio-coordinator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 9047
              name: web
            - containerPort: 32010
              name: flight
            - containerPort: 31010
              name: jdbc
            - containerPort: 45678
              name: inter-node
          env:
            - name: DREMIO_MAX_HEAP_MEMORY_SIZE_MB
              value: "2048"
            - name: DREMIO_MAX_DIRECT_MEMORY_SIZE_MB
              value: "2048"
          resources:
            requests:
              cpu: {{ .Values.coordinator.cpu | quote }}
              memory: "5120Mi"
            limits:
              cpu: {{ .Values.coordinator.cpu | quote }}
              memory: "5120Mi"
          volumeMounts:
            - name: dremio-data
              mountPath: /opt/dremio/data
            - name: dremio-config
              mountPath: /opt/dremio/conf
          startupProbe:
            httpGet:
              path: /
              port: 9047
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: 9047
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: 9047
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: dremio-config
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: dremio-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.coordinator.volumeSize }}
